<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | Login Flask</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }
        .card {
            width: 100%;
            max-width: 650px;
            padding: 45px 30px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px #0f172a12;
        }
        .icon { font-size: 55px; }
        h1 { color: #172554; }
        .nombre { color: #2563eb; }
        p { color: #64748b; line-height: 1.6; }
        button {
            padding: 12px 25px;
            border: 0;
            border-radius: 8px;
            background: #dc2626;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">🎉</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}" role="status">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <h1>¡Bienvenido, <span class="nombre">{{ nombre }}</span>!</h1>
        <p>Has iniciado sesión correctamente.</p>
        <p>Tu cuenta está activa y puedes acceder a esta página privada.</p>

        <form method="POST" action="{{ url_for('logout') }}">
            <button type="submit">Cerrar sesión</button>
        </form>
    </main>
</body>
</html>
