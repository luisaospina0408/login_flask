<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Login Flask</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #7c3aed);
        }
        .card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 15px 40px #0003;
        }
        h1 { text-align: center; color: #172554; }
        p { text-align: center; color: #64748b; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        a { color: #7c3aed; }
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            background: #eff6ff;
            color: #1e40af;
        }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Crear cuenta</h1>
        <p>Completa los datos para registrarte</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}" role="status">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('registro') }}">
            <label for="nombre">Nombre completo</label>
            <input id="nombre" type="text" name="nombre"
                   maxlength="100" autocomplete="name" required>

            <label for="correo">Correo electrónico</label>
            <input id="correo" type="email" name="correo"
                   maxlength="254" autocomplete="email" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password"
                   minlength="8" autocomplete="new-password" required>

            <label for="confirmar">Confirmar contraseña</label>
            <input id="confirmar" type="password" name="confirmar"
                   minlength="8" autocomplete="new-password" required>

            <button type="submit">Crear cuenta</button>
        </form>

        <p>¿Ya tienes una cuenta?
            <a href="{{ url_for('login') }}">Inicia sesión</a>
        </p>
    </main>
</body>
</html>
